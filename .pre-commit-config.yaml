default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-push]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: []
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        exclude: ^pnpm-lock\.yaml$
  - repo: local
    hooks:
      - id: djlint
        name: djlint
        entry: uv run djlint --check --lint obox_builder
        language: system
        types: [html]
        pass_filenames: false
      - id: biome
        name: biome
        entry: pnpm lint
        language: system
        pass_filenames: false
        always_run: true
      - id: uv-lock
        name: uv lock
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-pyproject
        name: validate-pyproject
        entry: uv run validate-pyproject
        language: system
        types: [toml]
        files: ^pyproject\.toml$
      - id: gettext-catalogs
        name: gettext catalogs
        entry: uv run python scripts/check_gettext_catalogs.py
        language: system
        pass_filenames: false
        always_run: true
      - id: commitlint
        name: commitlint
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: lint-imports
        entry: uv run lint-imports
        language: system
        always_run: true
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy obox_builder
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.9.0
    hooks:
      - id: zizmor
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [manual]
