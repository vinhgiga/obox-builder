services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: obox
      POSTGRES_PASSWORD: obox
      POSTGRES_DB: obox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obox -d obox"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
