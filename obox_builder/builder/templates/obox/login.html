{% extends base_template %}
{% block content %}
  {% if error %}<p class="text-red-800" role="alert">{{ _(error) }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label for="username">{{ _(login_label) }}</label>
    <input id="username"
           name="username"
           autocomplete="username"
           maxlength="150"
           required
           autofocus>
    <label for="password">{% trans %}Password{% endtrans %}</label>
    <input id="password"
           name="password"
           type="password"
           autocomplete="current-password"
           maxlength="1024"
           required>
    <p>
      <button type="submit">{% trans %}Sign in{% endtrans %}</button>
    </p>
  </form>
{% endblock %}
