<!DOCTYPE html>
<html lang="{{ language|default('en') }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site_title }} · {{ title }}</title>
    <link rel="stylesheet"
          href="{{ request.url_for('obox_static', path='tabler.min.css') }}?v=1.7.1">
    <link rel="stylesheet"
          href="{{ request.url_for('obox_static', path='ui.css') }}?v=20261110-1">
  </head>
  <body class="page">
    <main class="login-page">
      <section class="login-card card" aria-labelledby="login-title">
        <header class="card-header">
          <h1 id="login-title" class="card-title m-0">{{ site_title }}</h1>
        </header>
        <div class="card-body">
          {% if error %}<p class="alert alert-danger" role="alert">{{ _(error) }}</p>{% endif %}
          <form class="login-form" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf }}">
            <label class="form-label" for="username">{{ _(login_label) }}</label>
            <input class="form-control mb-3"
                   id="username"
                   name="username"
                   autocomplete="username"
                   maxlength="150"
                   required
                   autofocus>
            <label class="form-label" for="password">{% trans %}Password{% endtrans %}</label>
            <input class="form-control mb-3"
                   id="password"
                   name="password"
                   type="password"
                   autocomplete="current-password"
                   maxlength="1024"
                   required>
            <label class="form-check mb-3" for="show-password">
              <input class="form-check-input" id="show-password" type="checkbox">
              <span class="form-check-label">{% trans %}Show password{% endtrans %}</span>
            </label>
            <p class="text-center mb-0">
              <button class="btn btn-primary"
                      type="submit">{% trans %}Sign in{% endtrans %}</button>
            </p>
          </form>
        </div>
      </section>
    </main>
    <script>
      document.getElementById("show-password").addEventListener("change", (event) => {
        document.getElementById("password").type = event.currentTarget.checked ? "text" : "password";
      });
    </script>
  </body>
</html>
