<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; color: #172337; background: #f8fafc; }
    a { color: #1255b5; } table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: .7rem; border-bottom: 1px solid #d6dce5; text-align: left; }
    input, select, textarea, button { font: inherit; padding: .5rem; max-width: 100%; }
    label { display: block; margin-top: 1rem; } textarea { width: 35rem; min-height: 6rem; }
    .error { color: #a01925; } .help { color: #526174; } nav, form { margin: 1rem 0; }
    button, .button { cursor: pointer; } dt { font-weight: 600; } dd { margin-bottom: 1rem; overflow-wrap: anywhere; }
  </style>
</head>
<body><main><h1>{{ title }}</h1>{% block content %}{% endblock %}</main></body>
</html>
