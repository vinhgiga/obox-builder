<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Admin{% endblock %} &middot; {{ site_title }}</title>
  <link rel="stylesheet" href="{{ static('admin/vendor/tabler/tabler.min.css') }}"/>
  <link rel="stylesheet" href="{{ static('admin/vendor/tabler-icons/tabler-icons.min.css') }}"/>
  <link rel="stylesheet" href="{{ static('admin/css/tw.css') }}"/>
  <link rel="stylesheet" href="{{ static('admin/css/admin.css') }}"/>
</head>
<body class="d-flex flex-column bg-body-tertiary">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <div class="h1 admin-brand">{{ site_header }}</div>
    </div>
    {% include "admin/includes/flash.html" %}
    <div class="card card-md">
      <div class="card-body">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</div>
<script src="{{ static('admin/vendor/tabler/tabler.min.js') }}" defer></script>
</body>
</html>
