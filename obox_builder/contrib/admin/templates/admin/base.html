<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Admin{% endblock %} &middot; {{ site_name }}</title>
  <link rel="stylesheet" href="{{ static('admin/vendor/tabler/tabler.min.css') }}"/>
  <link rel="stylesheet" href="{{ static('admin/vendor/tabler-icons/tabler-icons.min.css') }}"/>
  <link rel="stylesheet" href="{{ static('admin/css/tw.css') }}"/>
  <link rel="stylesheet" href="{{ static('admin/css/admin.css') }}"/>
  {% block extra_css %}{% endblock %}
</head>
<body class="layout-fluid">
<div class="page">
  {% include "admin/includes/sidebar.html" %}
  <div class="page-wrapper">
    {% include "admin/includes/navbar.html" %}
    <div class="page-body">
      <div class="container-xl">
        {% include "admin/includes/flash.html" %}
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</div>
<script src="{{ static('admin/vendor/tabler/tabler.min.js') }}" defer></script>
<script src="{{ static('admin/js/admin.js') }}" defer></script>
{% block extra_js %}{% endblock %}
</body>
</html>
