<aside class="admin-views-sidebar" id="saved-views-panel" data-views-sidebar hidden aria-label="Saved views">
  <h3>Views</h3>
  <label class="visually-hidden" for="saved-view-search">Find a view</label>
  <input type="search" class="form-control form-control-sm" id="saved-view-search"
         placeholder="Find a view" data-view-search/>
  <nav class="admin-list-views" aria-label="My views">
    <a href="{{ admin.list_path() }}" class="admin-saved-view{{ ' is-active' if not selected_view }}"
       {% if not selected_view %}aria-current="page"{% endif %} data-saved-view>
      <i class="ti ti-table" aria-hidden="true"></i><span>Grid view</span>
    </a>
    {% for view in saved_views %}
    <a href="{{ admin.list_path() }}?view={{ view.id }}" class="admin-saved-view{{ ' is-active' if selected_view and selected_view.id == view.id }}"
       {% if selected_view and selected_view.id == view.id %}aria-current="page"{% endif %} data-saved-view>
      <i class="ti ti-table" aria-hidden="true"></i><span>{{ view.name }}</span>
    </a>
    {% endfor %}
    <span class="text-secondary small" data-views-empty hidden>No matching views.</span>
  </nav>
  <form method="post" action="{{ admin.list_path() }}/views{% if request.url.query %}?{{ request.url.query }}{% endif %}"
        class="admin-list-view-save" data-save-view data-save-query>
    <label class="form-label mb-1" for="save-view-name">Save current view</label>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
    <input id="save-view-name" name="name" value="{{ selected_view.name if selected_view else '' }}"
           class="form-control form-control-sm" required maxlength="100"
           placeholder="View name" aria-label="View name"/>
    <button type="submit" class="btn btn-sm">{{ 'Update view' if selected_view else 'Save view' }}</button>
    {% if selected_view %}<button type="submit" name="save_as" value="new" class="btn btn-sm">Save as new</button>{% endif %}
  </form>
</aside>
