<div class="admin-view-controls">
  <button type="button" class="btn btn-sm btn-icon" data-views-toggle
          aria-label="{{ _('Toggle saved views') }}" aria-controls="saved-views-panel" aria-expanded="false">
    <i class="ti ti-menu-2" aria-hidden="true"></i>
  </button>
  <details class="admin-view-menu" data-view-menu>
    <summary class="btn btn-sm" aria-label="{{ _('View options') }}">
      <i class="ti ti-table text-primary" aria-hidden="true"></i>
      <span data-current-view-name>{{ selected_view.name if selected_view else _('Grid view') }}</span>
      <i class="ti ti-chevron-down" aria-hidden="true"></i>
    </summary>
    <div class="admin-view-menu-panel" role="menu" aria-label="{{ _('View options') }}">
      <button type="button" role="menuitem" data-view-rename><i class="ti ti-pencil" aria-hidden="true"></i>{{ _('Rename view') }}</button>
      <form method="post" action="{{ admin.list_path() }}/views{% if selected_view %}/{{ selected_view.id }}/duplicate{% elif request.url.query %}?{{ request.url.query }}{% endif %}"
            {% if not selected_view %}data-save-query{% endif %}>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
        {% if not selected_view %}
        <input type="hidden" name="name" value="{{ _('Grid view copy') }}"/>
        <input type="hidden" name="save_as" value="new"/>
        {% endif %}
        <button type="submit" role="menuitem"><i class="ti ti-copy" aria-hidden="true"></i>{{ _('Duplicate view') }}</button>
      </form>
      <div class="admin-view-menu-divider"></div>
      <a href="{{ admin.list_path() }}/export.csv?{{ request.url.query }}" role="menuitem"
         hx-boost="false" download data-view-csv><i class="ti ti-download" aria-hidden="true"></i>{{ _('Download CSV') }}</a>
      <div class="admin-view-menu-divider"></div>
      {% if selected_view %}
      <form method="post" action="{{ admin.list_path() }}/views/{{ selected_view.id }}/delete"
            class="admin-list-view-delete" data-confirm="{{ _('Delete saved view %(name)s?', name=selected_view.name) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
        <button type="submit" role="menuitem" class="text-danger"><i class="ti ti-trash" aria-hidden="true"></i>{{ _('Delete view') }}</button>
      </form>
      {% else %}
      <button type="button" role="menuitem" disabled title="{{ _('The default view cannot be deleted.') }}"><i class="ti ti-trash" aria-hidden="true"></i>{{ _('Delete view') }}</button>
      {% endif %}
    </div>
  </details>
</div>
<dialog class="admin-view-dialog" data-view-name-dialog aria-labelledby="view-name-title">
  <form method="post" action="{{ admin.list_path() }}/views{% if selected_view %}/{{ selected_view.id }}/rename{% endif %}"
        data-save-query>
    <h3 id="view-name-title">{{ _('Rename view') }}</h3>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
    <input class="form-control" name="name" value="{{ selected_view.name if selected_view else _('Grid view') }}"
           aria-label="{{ _('New view name') }}" required maxlength="100" autofocus/>
    <div class="btn-list justify-content-end mt-3">
      <button type="button" class="btn" data-view-name-cancel>{{ _('Cancel') }}</button>
      <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
    </div>
  </form>
</dialog>
