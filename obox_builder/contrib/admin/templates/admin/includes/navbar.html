<header id="admin-navbar"{% if admin_fragment %} hx-swap-oob="outerHTML"{% endif %} class="navbar navbar-expand-md d-print-none">
  <div class="container-xl">
    <form method="get" action="/admin/search" class="d-flex gap-2 me-3" role="search">
      <input type="search" name="q" maxlength="200" class="form-control" placeholder="{{ _('Search all models') }}" aria-label="{{ _('Search all models') }}"/>
      <button type="submit" class="btn">{{ _("Search") }}</button>
    </form>
    <div class="navbar-nav flex-row order-md-last">
      {% include "admin/includes/language_selector.html" %}
      <button type="button" class="btn btn-ghost-secondary me-3" data-theme-toggle aria-label="{{ _('Switch to dark theme') }}">{{ _("Dark mode") }}</button>
      <div class="nav-item dropdown">
        <a href="#" class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown" aria-label="{{ _('Account menu') }}">
          <span class="avatar avatar-sm bg-primary-lt">{{ (user.username or "?")[0] | upper }}</span>
          <div class="d-none d-xl-block ps-2">
            <div>{{ user.full_name or user.username }}</div>
            <div class="mt-1 small text-secondary">{{ _("Superuser") if user.is_superuser else _("Staff") }}</div>
          </div>
        </a>
        <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
          <a href="/admin/password_change" class="dropdown-item"><i class="ti ti-key me-2"></i>{{ _("Change password") }}</a>
          <form method="post" action="/admin/logout" hx-boost="false" class="m-0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
            <button type="submit" class="dropdown-item"><i class="ti ti-logout me-2"></i>{{ _("Log out") }}</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</header>
