<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Forbidden &middot; {{ site_title or site_name or "obox admin" }}</title>
  <link rel="stylesheet" href="{{ static('admin/vendor/tabler/tabler.min.css') }}"/>
</head>
<body class="border-top-wide border-danger d-flex flex-column">
<div class="page page-center">
  <div class="container-tight py-4">
    <div class="empty">
      <div class="empty-header">403</div>
      <p class="empty-title">Permission denied</p>
      <p class="empty-subtitle text-secondary">{{ reason or "You do not have permission to access this page." }}</p>
      <div class="empty-action">
        <a href="/admin/" class="btn btn-primary">Back to dashboard</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
