name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:commitlint
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            pnpm exec commitlint --last --verbose
          else
            pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check --output-format=github obox_builder
      - run: uv run ruff format --check obox_builder
      - run: uv run mypy obox_builder
      - run: uv run pyright
      - run: uv run lint-imports

  wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv build
      - name: Install the wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/wheel-env"
          wheels=(dist/*.whl)
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" "${wheels[0]}[sqlite]"
      - name: Check installed exports and HTML templates outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/wheel-env/bin/python" -I -c
          "from obox_builder import Obox, ModelBuilder, ResourceService;
          from obox_builder.auth import StaffOnly;
          from obox_builder.builder.ui import templates;
          templates.get_template('form.html')"
