name: Publish package

on:
  push:
    tags:
      - "v*"
      - "test-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: ${{ startsWith(github.ref_name, 'test-v') && 'testpypi' || 'pypi' }}
      url: ${{ startsWith(github.ref_name, 'test-v') && 'https://test.pypi.org/project/obox-builder/' || 'https://pypi.org/project/obox-builder/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --all-extras --locked
      - run: uv run validate-pyproject pyproject.toml
      - run: uv build
      - run: uv run twine check dist/*
      - name: Publish to TestPyPI
        if: startsWith(github.ref_name, 'test-v')
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/
      - name: Publish to PyPI
        if: startsWith(github.ref_name, 'v')
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
